name: Release Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Rebuild better-sqlite3 native module for the Electron ABI.
      # electron-rebuild targets the Electron version listed in package.json
      # (currently Electron 28 / Node ABI 120).
      - name: Rebuild native modules for Electron
        run: npx electron-rebuild -f -w better-sqlite3
        shell: pwsh

      # Decode the signing certificate only when the secret is present.
      # electron-builder signs when CSC_LINK is set and skips signing otherwise,
      # so absent secrets produce a valid but unsigned installer.
      - name: Prepare code-signing certificate
        id: signing
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
        run: |
          if ([string]::IsNullOrEmpty($env:WINDOWS_CERT_BASE64)) {
            Write-Host "No signing certificate secret found — building unsigned."
            "signed=false" >> $env:GITHUB_OUTPUT
          } else {
            $pfxPath = Join-Path $env:RUNNER_TEMP "windows-cert.pfx"
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
            "csc_link=$pfxPath" >> $env:GITHUB_OUTPUT
            "signed=true" >> $env:GITHUB_OUTPUT
            Write-Host "Signing certificate decoded."
          }

      - name: Build renderer + Electron main/preload
        shell: pwsh
        run: npm run build

      - name: Build NSIS installer
        shell: pwsh
        env:
          CSC_LINK: ${{ steps.signing.outputs.csc_link }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --x64 --publish never

      - name: Get version
        id: version
        shell: pwsh
        run: |
          $ver = (Get-Content package.json | ConvertFrom-Json).version
          "version=$ver" >> $env:GITHUB_OUTPUT
          $tag = "v$ver-build-$(Get-Date -Format 'yyyyMMdd-HHmmss')"
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Attach installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Inkwell ${{ steps.version.outputs.version }} (${{ github.run_number }})
          prerelease: false
          files: release/*.exe

      - name: Prune old releases (keep last 3)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $releases = gh api repos/${{ github.repository }}/releases --paginate | ConvertFrom-Json
          $sorted = $releases | Sort-Object { [datetime]$_.created_at } -Descending
          $toDelete = $sorted | Select-Object -Skip 3
          foreach ($rel in $toDelete) {
            Write-Host "Deleting release: $($rel.name) (id=$($rel.id), tag=$($rel.tag_name))"
            gh api --method DELETE repos/${{ github.repository }}/releases/$($rel.id)
            gh api --method DELETE repos/${{ github.repository }}/git/refs/tags/$($rel.tag_name)
          }
